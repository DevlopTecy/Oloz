AULT': '0.25rem', 'lg': '0.5rem', 'xl': '0.75rem', 'full': '9999px' }, 'spacing': { 'margin': '1.25rem', 'gutter': '1rem', 'space-sm': '0.5rem', 'space-lg': '1rem', 'margin-desktop': '2rem', 'gutter-desktop': '1.5rem', 'space-md': '0.75rem', 'space-xl': '1.5rem', 'space-2xl': '2rem', 'space-xs': '0.25rem', 'space-3xl': '3rem' }, 'fontFamily': { 'caption-default': ['Inter'], 'display-lg-mobile': ['Inter'], 'body-medium': ['Inter'], 'title-md': ['Inter'], 'caption-tabular': ['Inter'], 'body-default': ['Inter'], 'section-title': ['Inter'], 'title-lg': ['Inter'], 'display-lg': ['Inter'] }, 'fontSize': { 'caption-default': ['12px', { 'lineHeight': '16px', 'fontWeight': '500' }], 'display-lg-mobile': ['36px', { 'lineHeight': '44px', 'letterSpacing': '-0.02em', 'fontWeight': '600' }], 'body-medium': ['14px', { 'lineHeight': '20px', 'fontWeight': '500' }], 'title-md': ['18px', { 'lineHeight': '24px', 'fontWeight': '600' }], 'caption-tabular': ['12px', { 'lineHeight': '16px', 'letterSpacing': '0.02em', 'fontWeight': '500' }], 'body-default': ['14px', { 'lineHeight': '20px', 'fontWeight': '400' }], 'section-title': ['16px', { 'lineHeight': '22px', 'fontWeight': '600' }], 'title-lg': ['22px', { 'lineHeight': '28px', 'letterSpacing': '-0.01em', 'fontWeight': '600' }], 'display-lg': ['40px', { 'lineHeight': '48px', 'letterSpacing': '-0.02em', 'fontWeight': '600' }] } } } };</script><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;background-color:#F6F5F2;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head><body class="bg-bg-app text-text-primary font-body-default min-h-screen flex flex-col antialiased selection:bg-primary-soft selection:text-primary"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.03)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><div class="w-7 h-7 rounded-xl bg-primary flex items-center justify-center text-on-primary font-section-title text-section-title shadow-sm">O</div><span class="font-title-md text-title-md text-text-primary tracking-tight">Oloz</span></div><h1 class="text-body-medium font-body-medium text-text-secondary truncate max-w-[140px]">Home</h1><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-sm"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 w-full pt-16 pb-20 bg-bg-app"><div class="flex flex-col w-full">
<div class="flex flex-col items-center justify-center px-margin min-h-[calc(100vh-9rem)] py-space-3xl select-none">
<!-- Gentle Ambient Glow behind the Focal Anchor -->
<div class="relative flex items-center justify-center mb-space-2xl">
<div class="absolute w-36 h-36 rounded-full bg-primary-soft/50 blur-2xl pointer-events-none transition-transform duration-700 ease-out" id="glow-halo"></div>
<!-- Mindful Ring Glyph Container (72px) -->
<div aria-label="Tracking indicator status" class="relative w-[72px] h-[72px] rounded-full bg-surface shadow-[0_4px_20px_rgba(35,38,43,0.04)] flex items-center justify-center group cursor-pointer transition-transform active:scale-95 duration-200" id="ring-container" role="button">
<!-- Soft Indigo SVG Ring (Subtle 8px stroke, soothing aesthetic) -->
<svg class="w-[72px] h-[72px] transform -rotate-90" fill="none" viewbox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
<!-- Background Base Track -->
<circle class="text-primary-soft stroke-current opacity-80" cx="36" cy="36" r="28" stroke="currentColor" stroke-linecap="round" stroke-width="8"></circle>
<!-- Harmonic Accent Segment -->
<circle class="text-primary-container stroke-current transition-all duration-1000 ease-out" cx="36" cy="36" id="animated-segment" r="28" stroke="currentColor" stroke-dasharray="176" stroke-dashoffset="132" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<!-- Gentle Center Dot -->
<div class="absolute w-3.5 h-3.5 rounded-full bg-secondary-container/90 transition-transform duration-300 group-hover:scale-110 shadow-sm"></div>
</div>
</div>
<!-- Calm Mindful Copy -->
<h2 class="font-title-md text-title-md text-text-primary tracking-tight text-center mb-space-2xl">
      Nothing tracked yet
    </h2>
<!-- Solitary Primary Action -->
<button class="w-[200px] h-12 rounded-[14px] bg-primary-container hover:bg-primary text-on-primary font-body-medium text-body-medium shadow-[0_4px_16px_rgba(88,112,194,0.18)] flex items-center justify-center transition-all duration-200 active:scale-[0.98] outline-none" id="access-btn" type="button">
<span class="transition-opacity duration-150" id="btn-label">Allow usage access</span>
<span class="hidden material-symbols-outlined text-[20px] animate-spin text-on-primary" id="btn-spinner">progress_activity</span>
</button>
<!-- Ephemeral gentle feedback hint -->
<p class="font-caption-default text-caption-default text-text-secondary text-center mt-space-md opacity-0 transition-opacity duration-300" id="helper-note">
      Enabling private screen metrics…
    </p>
</div>
<script>
    (function() {
      const btn = document.getElementById('access-btn');
      const label = document.getElementById('btn-label');
      const spinner = document.getElementById('btn-spinner');
      const helper = document.getElementById('helper-note');
      const ringContainer = document.getElementById('ring-container');
      const animatedSegment = document.getElementById('animated-segment');
      const glowHalo = document.getElementById('glow-halo');

      if (!btn) return;

      btn.addEventListener('click', function() {
        // Subtle haptic feel & progress response
        label.classList.add('hidden');
        spinner.classList.remove('hidden');
        helper.classList.remove('opacity-0');
        
        // Gentle breathing expansion
        if (animatedSegment) {
          animatedSegment.setAttribute('stroke-dashoffset', '0');
        }
        if (glowHalo) {
          glowHalo.classList.add('scale-125');
        }

        setTimeout(function() {
          spinner.classList.add('hidden');
          label.textContent = 'Access granted';
          label.classList.remove('hidden');
          helper.textContent = 'Calibrating screen rhythm';
        }, 1400);
      });

      // Subtle ambient hover interplay
      if (ringContainer) {
        ringContainer.addEventListener('mouseenter', function() {
          if (glowHalo) glowHalo.classList.add('scale-110');
        });
        ringContainer.addEventListener('mouseleave', function() {
          if (glowHalo && !btn.disabled) glowHalo.classList.remove('scale-110');
        });
      }
    })();
  </script>
</div></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/85 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,0,0,0.03)]" data-active-classes="text-primary font-semibold"><div class="h-16 px-margin flex items-center justify-around"><a aria-current="page" class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-xs transition-colors duration-150 text-primary font-semibold" data-path="home" href="#"><span class="material-symbols-outlined text-[24px]">dashboard</span><span class="font-caption-default text-caption-default mt-0.5">Home</span></a><a class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-xs text-text-secondary transition-colors duration-150" data-path="reels" href="#"><span class="material-symbols-outlined text-[24px]">play_circle</span><span class="font-caption-default text-caption-default mt-0.5">Reels</span></a><a class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-xs text-text-secondary transition-colors duration-150" data-path="apps" href="#"><span class="material-symbols-outlined text-[24px]">apps</span><span class="font-caption-default text-caption-default mt-0.5">Apps</span></a><a class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-xs text-text-secondary transition-colors duration-150" data-path="settings" href="#"><span class="material-symbols-outlined text-[24px]">tune</span><span class="font-caption-default text-caption-default mt-0.5">Settings</span></a></div></nav></body></html>
