<script>
  (function() {
    const btn = document.getElementById('get-started-btn');
    if (btn) {
      btn.addEventListener('click', function() {
        this.classList.add('opacity-90');
        const indigoArc = document.getElementById('indigo-arc');
        const peachArc = document.getElementById('peach-arc');
        if (indigoArc && peachArc) {
          indigoArc.setAttribute('stroke-dashoffset', '30');
          peachArc.setAttribute('stroke-dashoffset', '140');
        }
        setTimeout(() => {
          this.classList.remove('opacity-90');
        }, 300);
      });
    }
  })();
