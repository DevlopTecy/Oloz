d text-[20px] text-text-primary">add</span></button></div><div class="mb-5"><span class="font-caption-default text-caption-default text-text-secondary mb-2.5 block">Quick presets</span><div aria-label="Limit duration presets" class="grid grid-cols-4 gap-2" role="group"><button class="preset-chip h-9 rounded-full bg-surface-muted text-text-secondary font-caption-tabular text-caption-tabular flex items-center justify-center transition-colors duration-150 active:scale-95" data-minutes="45" type="button">45m</button><button class="preset-chip h-9 rounded-full bg-surface-muted text-text-secondary font-caption-tabular text-caption-tabular flex items-center justify-center transition-colors duration-150 active:scale-95" data-minutes="60" type="button">1h</button><button class="preset-chip h-9 rounded-full bg-primary-soft text-primary font-caption-tabular text-caption-tabular flex items-center justify-center font-semibold transition-colors duration-150 active:scale-95 shadow-sm" data-minutes="90" type="button">1h 30m</button><button class="preset-chip h-9 rounded-full bg-surface-muted text-text-secondary font-caption-tabular text-caption-tabular flex items-center justify-center transition-colors duration-150 active:scale-95" data-minutes="120" type="button">2h</button></div></div><div class="bg-surface-muted rounded-[18px] px-4 py-3.5 flex items-center justify-between mb-6"><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-surface flex items-center justify-center text-primary"><span class="material-symbols-outlined text-[18px]">notifications_active</span></div><span class="font-body-medium text-body-medium text-text-primary font-medium">Remind me</span></div><button aria-checked="true" class="relative w-[50px] h-[28px] rounded-full bg-primary transition-colors duration-200 focus:outline-none p-[3px] flex items-center" id="reminder-toggle" role="switch" type="button"><span class="w-[22px] h-[22px] rounded-full bg-on-primary shadow-sm transform translate-x-[22px] transition-transform duration-200" id="toggle-thumb"></span></button></div><button class="w-full h-12 rounded-[14px] bg-primary text-on-primary font-body-medium text-body-medium font-semibold flex items-center justify-center gap-2 active:scale-[0.99] transition-all duration-150 shadow-[0_4px_16px_rgba(62,87,167,0.22)]" id="save-button" type="button"><span class="">Save</span></button></section></div>
</div>
<script>
  (function() {
    let currentMinutes = 90;
    const minMinutes = 15;
    const maxMinutes = 360;
    const step = 15;

    const display = document.getElementById('display-time');
    const btnDec = document.getElementById('btn-decrement');
    const btnInc = document.getElementById('btn-increment');
    const presetButtons = document.querySelectorAll('.preset-chip');
    const toggleBtn = document.getElementById('reminder-toggle');
    const toggleThumb = document.getElementById('toggle-thumb');
    const saveBtn = document.getElementById('save-button');

    function formatTime(totalMinutes) {
      const hours = Math.floor(totalMinutes / 60);
      const mins = totalMinutes % 60;
      if (hours > 0 && mins > 0) {
        return `${hours}h ${String(mins).padStart(2, '0')}m`;
      } else if (hours > 0) {
        return `${hours}h 00m`;
      } else {
        return `${mins}m`;
      }
    }

    function updateView() {
      if (display) {
        display.textContent = formatTime(currentMinutes);
      }
      presetButtons.forEach(btn => {
        const val = parseInt(btn.getAttribute('data-minutes'), 10);
        if (val === currentMinutes) {
          btn.className = "preset-chip h-9 rounded-full bg-primary-soft text-primary font-caption-tabular text-caption-tabular flex items-center justify-center font-semibold transition-colors duration-150 active:scale-95 shadow-sm";
        } else {
          btn.className = "preset-chip h-9 rounded-full bg-surface-muted text-text-secondary font-caption-tabular text-caption-tabular flex items-center justify-center transition-colors duration-150 active:scale-95";
        }
      });
    }

    if (btnDec) {
      btnDec.addEventListener('click', () => {
        if (currentMinutes > minMinutes) {
          currentMinutes -= step;
          updateView();
        }
      });
    }

    if (btnInc) {
      btnInc.addEventListener('click', () => {
        if (currentMinutes < maxMinutes) {
          currentMinutes += step;
          updateView();
        }
      });
    }

    presetButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const val = parseInt(btn.getAttribute('data-minutes'), 10);
        if (!isNaN(val)) {
          currentMinutes = val;
          updateView();
        }
      });
    });

    let reminderActive = true;
    if (toggleBtn && toggleThumb) {
      toggleBtn.addEventListener('click', () => {
        reminderActive = !reminderActive;
        toggleBtn.setAttribute('aria-checked', reminderActive ? 'true' : 'false');
        if (reminderActive) {
          toggleBtn.classList.remove('bg-outline-variant');
          toggleBtn.classList.add('bg-primary');
          toggleThumb.classList.remove('translate-x-0');
          toggleThumb.classList.add('translate-x-[22px]');
        } else {
          toggleBtn.classList.remove('bg-primary');
          toggleBtn.classList.add('bg-outline-variant');
          toggleThumb.classList.remove('translate-x-[22px]');
          toggleThumb.classList.add('translate-x-0');
        }
      });
    }

    if (saveBtn) {
      saveBtn.addEventListener('click', () => {
        const originalContent = saveBtn.innerHTML;
        saveBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span><span>Saved</span>';
        saveBtn.classList.add('bg-success');
        setTimeout(() => {
          saveBtn.innerHTML = originalContent;
          saveBtn.classList.remove('bg-success');
        }, 1200);
      });
    }
  })();
</script></main>
