<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "tertiary-fixed": "#ffe08c", "surface-container": "#eceef4", "surface-bright": "#f8f9ff", "on-error-container": "#93000a", "on-tertiary-fixed-variant": "#584400", "surface-container-low": "#f2f3fa", "on-primary-fixed-variant": "#274190", "on-primary-container": "#fffbff", "secondary": "#88503a", "on-surface": "#191c21", "on-tertiary-fixed": "#241a00", "surface-container-lowest": "#ffffff", "on-secondary-fixed": "#350f02", "secondary-fixed": "#ffdbce", "on-primary": "#ffffff", "outline-variant": "#c5c5d3", "tertiary-fixed-dim": "#eac249", "secondary-fixed-dim": "#feb59a", "border-subtle": "#E4E2DC", "on-surface-variant": "#444651", "surface-tint": "#415aaa", "secondary-container": "#feb59a", "surface-container-high": "#e6e8ef", "inverse-primary": "#b6c4ff", "surface-dim": "#d8dae0", "on-secondary-fixed-variant": "#6b3925", "primary-container": "#5870c2", "on-background": "#191c21", "text-secondary": "#6E727A", "inverse-surface": "#2e3136", "on-primary-fixed": "#00164e", "surface-muted": "#EEEDE9", "warning": "#E6C27A", "primary-fixed": "#dce1ff", "surface-container-highest": "#e1e2e9", "on-tertiary-container": "#4f3d00", "error-container": "#ffdad6", "primary-fixed-dim": "#b6c4ff", "tertiary-container": "#cda72f", "text-primary": "#23262B", "success": "#7FB69A", "accent-soft": "#FBE9E1", "inverse-on-surface": "#eff0f7", "on-secondary": "#ffffff", "primary-soft": "#E3E8F8", "background": "#f8f9ff", "bg-app": "#F6F5F2", "outline": "#757682", "on-tertiary": "#ffffff", "on-secondary-container": "#79452f", "tertiary": "#745b00", "danger": "#D98A8A", "primary": "#3e57a7", "error": "#ba1a1a", "surface": "#FFFFFF", "surface-variant": "#e1e2e9", "on-error": "#ffffff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-lg": "1rem", "gutter-desktop": "1.5rem", "space-xs": "0.25rem", "margin": "1.25rem", "gutter": "1rem", "margin-desktop": "2rem", "space-2xl": "2rem", "space-3xl": "3rem", "space-md": "0.75rem", "space-xl": "1.5rem", "space-sm": "0.5rem" }, fontFamily: { "title-lg": ["Inter"], "caption-tabular": ["Inter"], "caption-default": ["Inter"], "display-lg": ["Inter"], "display-lg-mobile": ["Inter"], "title-md": ["Inter"], "body-medium": ["Inter"], "section-title": ["Inter"], "body-default": ["Inter"] }, fontSize: { "title-lg": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "caption-tabular": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "caption-default": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "display-lg-mobile": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "body-medium": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "section-title": ["16px", { "lineHeight": "22px", "fontWeight": "600" }], "body-default": ["14px", { "lineHeight": "20px", "fontWeight": "400" }] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;background-color:#F6F5F2;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-bg-app min-h-screen text-on-surface font-body-default text-body-default antialiased flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full px-margin bg-bg-app"><div class="flex flex-col w-full pb-6 pt-2">
<!-- Top Bar & Steps Indicator -->
<div class="flex items-center justify-between w-full mb-6">
<button aria-label="Go back" class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-muted text-text-primary active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<div aria-label="Onboarding Progress" aria-valuemax="3" aria-valuemin="1" aria-valuenow="3" class="flex items-center space-x-2" role="progressbar">
<span class="w-2 h-2 rounded-full bg-border-subtle transition-all duration-300"></span>
<span class="w-2 h-2 rounded-full bg-border-subtle transition-all duration-300"></span>
<span class="w-6 h-2 rounded-full bg-primary transition-all duration-300"></span>
</div>
<div class="w-10 h-10"></div>
</div>
<!-- Editorial Header -->
<div class="flex flex-col space-y-1 mb-8">
<h1 class="font-title-lg text-title-lg text-text-primary tracking-tight">Daily goal</h1>

</div>
<!-- Interactive Goal Cards Stack -->
<div class="flex flex-col space-y-4 mb-8"><!-- Card 1: Screen time -->
<div class="w-full bg-surface-container-lowest rounded-[20px] p-5 shadow-[0_4px_20px_rgba(35,38,43,0.05)] flex flex-col justify-between relative overflow-hidden">
  <div class="flex items-center space-x-2 mb-3">
    <div class="w-7 h-7 rounded-full bg-primary-soft flex items-center justify-center text-primary">
      <span class="material-symbols-outlined text-[16px]">schedule</span>
    </div>
    <span class="font-body-medium text-body-medium text-text-primary font-medium">Screen time</span>
  </div>
  <div class="flex items-center justify-between py-1">
    <span class="font-display-lg-mobile text-display-lg-mobile text-text-primary tracking-tight font-semibold tabular-nums" id="screen-time-display">6h 00m</span>
    <div class="flex items-center space-x-2">
      <button aria-label="Decrease screen time" class="w-11 h-11 rounded-full bg-surface-muted text-text-primary flex items-center justify-center active:scale-90 transition-all hover:bg-surface-container select-none" id="screen-time-minus" type="button">
        <span class="material-symbols-outlined text-[20px]">remove</span>
      </button>
      <button aria-label="Increase screen time" class="w-11 h-11 rounded-full bg-surface-muted text-text-primary flex items-center justify-center active:scale-90 transition-all hover:bg-surface-container select-none" id="screen-time-plus" type="button">
        <span class="material-symbols-outlined text-[20px]">add</span>
      </button>
    </div>
  </div>
  <div class="w-full bg-surface-muted h-1 rounded-full mt-3 overflow-hidden">
    <div class="h-full rounded-full transition-all duration-300" id="screen-time-bar" style="width: 75%; background-color: #6B83D6;"></div>
  </div>
</div>

<!-- Card 2: Reels -->
<div class="w-full bg-surface-container-lowest rounded-[20px] p-5 shadow-[0_4px_20px_rgba(35,38,43,0.05)] flex flex-col justify-between relative overflow-hidden">
  <div class="flex items-center space-x-2 mb-3">
    <div class="w-7 h-7 rounded-full bg-accent-soft flex items-center justify-center text-secondary">
      <span class="material-symbols-outlined text-[16px]">play_circle</span>
    </div>
    <span class="font-body-medium text-body-medium text-text-primary font-medium">Reels</span>
  </div>
  <div class="flex items-center justify-between py-1">
    <div class="flex items-baseline space-x-1.5">
      <span class="font-display-lg-mobile text-display-lg-mobile text-text-primary font-semibold tracking-tight tabular-nums" id="reels-count-display">350</span>
      <span class="font-title-md text-title-md text-text-secondary font-medium">reels</span>
    </div>
    <div class="flex items-center space-x-2">
      <button aria-label="Decrease reel limit" class="w-11 h-11 rounded-full bg-surface-muted text-text-primary flex items-center justify-center active:scale-90 transition-all hover:bg-surface-container select-none" id="reels-minus" type="button">
        <span class="material-symbols-outlined text-[20px]">remove</span>
      </button>
      <button aria-label="Increase reel limit" class="w-11 h-11 rounded-full bg-surface-muted text-text-primary flex items-center justify-center active:scale-90 transition-all hover:bg-surface-container select-none" id="reels-plus" type="button">
        <span class="material-symbols-outlined text-[20px]">add</span>
      </button>
    </div>
  </div>
  <div class="w-full bg-surface-muted h-1 rounded-full mt-3 overflow-hidden">
    <div class="h-full rounded-full transition-all duration-300" id="reels-bar" style="width: 70%; background-color: #F0A98E;"></div>
  </div>
</div></div>
<!-- Gentle Editorial Motivation Callout -->

<!-- Stacked CTAs -->
<div class="flex flex-col space-y-3 mt-auto">
<button class="w-full h-12 rounded-[14px] bg-primary text-on-primary font-body-medium text-body-medium font-semibold flex items-center justify-center shadow-sm active:scale-[0.98] transition-all hover:opacity-95" id="done-btn" type="button" style="background-color: rgb(88, 112, 194);">
      Done
    </button>
<button class="w-full h-10 bg-transparent text-text-secondary font-body-medium text-body-medium flex items-center justify-center active:opacity-70 transition-opacity" type="button">
      Skip
    </button>
</div>
</div>
<script>
  (function () {
    let screenMinutes = 180; // 3h 00m
    let reelCount = 100;

    const screenTimeDisplay = document.getElementById('screen-time-display');
    const screenTimeBar = document.getElementById('screen-time-bar');
    const screenMinus = document.getElementById('screen-time-minus');
    const screenPlus = document.getElementById('screen-time-plus');

    const reelsCountDisplay = document.getElementById('reels-count-display');
    const reelsBar = document.getElementById('reels-bar');
    const reelsMinus = document.getElementById('reels-minus');
    const reelsPlus = document.getElementById('reels-plus');

    function updateScreenTime() {
      const hours = Math.floor(screenMinutes / 60);
      const mins = screenMinutes % 60;
      screenTimeDisplay.textContent = hours + 'h ' + (mins < 10 ? '0' : '') + mins + 'm';
      const pct = Math.min(Math.max(((screenMinutes - 60) / (360 - 60)) * 100, 10), 100);
      screenTimeBar.style.width = pct + '%';
    }

    function updateReels() {
      reelsCountDisplay.textContent = reelCount;
      const pct = Math.min(Math.max((reelCount / 250) * 100, 10), 100);
      reelsBar.style.width = pct + '%';
    }

    screenMinus.addEventListener('click', function () {
      if (screenMinutes > 60) {
        screenMinutes -= 15;
        updateScreenTime();
      }
    });

    screenPlus.addEventListener('click', function () {
      if (screenMinutes < 480) {
        screenMinutes += 15;
        updateScreenTime();
      }
    });

    reelsMinus.addEventListener('click', function () {
      if (reelCount > 20) {
        reelCount -= 10;
        updateReels();
      }
    });

    reelsPlus.addEventListener('click', function () {
      if (reelCount < 300) {
        reelCount += 10;
        updateReels();
      }
    });
  })();
</script></main>

</body></html>
